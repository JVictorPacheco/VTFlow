name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore VTFlow.Api/VTFlow.Api.csproj
          dotnet restore VTFlow.Api.Tests/VTFlow.Api.Tests.csproj
        working-directory: backend

      - name: Build
        run: dotnet build VTFlow.Api/VTFlow.Api.csproj --no-restore --configuration Release
        working-directory: backend

      - name: Test
        run: dotnet test VTFlow.Api.Tests/VTFlow.Api.Tests.csproj --no-restore --configuration Release
        working-directory: backend

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npx ng test --watch=false
        working-directory: frontend
